name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package and lab builds
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -E "macosx|iphonesimulator"

      - name: Require SDKs for the declared platforms
        run: |
          # Package.swift declares iOS 26 and macOS 26. Fail clearly when the
          # selected Xcode cannot build for them instead of failing mid-build.
          for sdk in macosx iphonesimulator; do
            version="$(xcrun --sdk "$sdk" --show-sdk-version)"
            major="${version%%.*}"
            echo "$sdk SDK $version"
            if [ "$major" -lt 26 ]; then
              echo "::error::$sdk SDK $version is older than the declared 26 minimum"
              exit 1
            fi
          done

      # GW-07: no package or laboratory path may block a thread on GPU work.
      - name: Reject blocking GPU waits
        run: |
          if grep -rnE "waitUntil(Completed|Scheduled)" Sources Examples/GlassWeaveLab/GlassWeaveLab; then
            echo "::error::A blocking GPU wait was found in package or laboratory sources"
            exit 1
          fi

      # The combined workspace's shared GlassWeave scheme builds every package
      # product and runs both test bundles with MTL_DEBUG_LAYER=1 (Metal API
      # Validation) set in its test action.
      - name: Build package (macOS Debug)
        run: xcodebuild build -workspace Examples/GlassWeave.xcworkspace -scheme GlassWeave -destination 'generic/platform=macOS' -configuration Debug CODE_SIGNING_ALLOWED=NO

      - name: Build package (macOS Release)
        run: xcodebuild build -workspace Examples/GlassWeave.xcworkspace -scheme GlassWeave -destination 'generic/platform=macOS' -configuration Release CODE_SIGNING_ALLOWED=NO

      - name: Build package (iOS Simulator Release)
        run: xcodebuild build -workspace Examples/GlassWeave.xcworkspace -scheme GlassWeave -destination 'generic/platform=iOS Simulator' -configuration Release CODE_SIGNING_ALLOWED=NO

      - name: Test package (macOS, Metal API Validation)
        run: xcodebuild test -workspace Examples/GlassWeave.xcworkspace -scheme GlassWeave -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

      # The UIKit tests run on an iOS simulator; CI compiles them without
      # depending on a particular simulator device being installed.
      - name: Build package tests (iOS Simulator)
        run: xcodebuild build-for-testing -workspace Examples/GlassWeave.xcworkspace -scheme GlassWeave -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

      - name: Build laboratory app and UI tests (iOS Simulator Debug)
        run: xcodebuild build-for-testing -workspace Examples/GlassWeave.xcworkspace -scheme GlassWeaveLab -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO
